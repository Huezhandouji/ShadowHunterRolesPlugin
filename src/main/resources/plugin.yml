name: ShadowHunterRolesPlugin
version: '${version}'

main: com.shadowHunterRolesPlugin.ShadowHunterRolesPlugin
paper-plugin-loader: com.shadowHunterRolesPlugin.ShadowHunterRolesPluginLoader
api-version: '1.21.11'
load: POSTWORLD

commands:
  role:
    description: "The command of ShadowHunter role system."
    # usage 必须与实际存在的子指令一致：help / set / clear / energy / debug / operation，
    #  其中 debug 下还有 cooldown / sched ⇒ 共 8 条子指令路径。
    #  旧的 "/role <list|choose|info>" 那三个子指令并不存在，照它敲必然失败。
    #  另：本命令块不声明权限字段 —— 门禁在代码侧按 ops.json 的等级 ≥ 3 判定，
    #  而权限字段表达不了"等级"（只有有/无），声明一个假权限只会误导运维。
    #  （本注释不写那个键名：写了会与"字段仍在"混淆。）
    usage: "/role <help|set|clear|energy|debug|operation>  |  /role debug <cooldown|sched> ..."
    aliases: [r]