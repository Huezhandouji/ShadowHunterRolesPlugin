group=com
version=1.0-SNAPSHOT
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# ── 环境前置（t58 立）：本工程路径含非 ASCII（…\插件\…），**本行不得删除** ──
# 根因：Gradle 守护进程默认以 UTF-8 写工作进程的 classpath `@argfile`，而 Java 启动器按
# **Windows ANSI 代码页**展开它 ⇒ 含 CJK 路径的 classpath 被解成乱码 ⇒ 每个测试工作进程都以
# `ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain` 死掉
# ⇒ `gradlew test`（以及会连带跑测试的 `gradlew build`）必失败。
# 修法：把守护进程的默认字符集改成与启动器一致（GBK）⇒ argfile 按 ANSI 写出、启动器按 ANSI 读回。
# 详细实验与最小工程复现见 `debug-logs/测试记录/阶段9-测试缝环境前置-说明.txt`（及 t57 说明件 §7）。
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=GBK

# ── 入库默认值：本文件**只放可移植项**（阶段 10 · t59 / 裁定 P3）────────────────────────
# 本机专属项（服务端 plugins 目录等）请写进 **gradle.local.properties** —— 它被 .gitignore 忽略、
# 不入库；**不存在时构建脚本按 no-op 处理** ⇒ 任务照常可用。本地覆盖**优先于**本文件的值。
# pluginCopyPath 的入库默认值是**工程内相对路径**（`copyPluginJar` 把成品 jar 复制到这里）；
# 本机要复制到真正的服务端目录时，在 gradle.local.properties 里覆盖，**不要改这一行** ✗
pluginCopyPath=run/plugins