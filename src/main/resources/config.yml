# ShadowHunterRoles 配置
#
# command-permission-level
#   使用本插件指令（/role 及其全部子指令）所需的最低权限等级。
#   · 取值范围 0-4；默认 3。
#   · 玩家等级来源 = 服务器根目录下的 ops.json（本版 paper-api 不提供可读的等级 API）。
#   · 改完本字段后需重启服务器（或执行 /reload confirm）才生效；
#     ops.json 本身的改动最迟 5 秒内生效（门禁侧 5 秒 TTL + 文件变更即失效）。
#   · 控制台 / RCON 不受此限制（等价等级 4）；其他指令发送者（如命令方块）一律拒绝。
command-permission-level: 3